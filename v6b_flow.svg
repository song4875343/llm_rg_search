<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="2180" viewBox="0 0 1380 2180" role="img" aria-labelledby="title desc">
  <title id="title">rg_search_v6b.py Agent 运行流程图</title>
  <desc id="desc">展示 rg_search_v6b.py 从启动初始化、索引检查、多轮工具调用、补充扫描、轮次判断到最终答案和依据抽取的流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #475569; }
      .section { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .section-title { font: 700 17px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #334155; }
      .node { stroke-width: 1.7; rx: 12; filter: url(#shadow); }
      .start { fill: #e0f2fe; stroke: #0284c7; }
      .process { fill: #f8fafc; stroke: #64748b; }
      .model { fill: #fef3c7; stroke: #d97706; }
      .tool { fill: #dcfce7; stroke: #16a34a; }
      .cache { fill: #ede9fe; stroke: #7c3aed; }
      .final { fill: #fee2e2; stroke: #dc2626; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; filter: url(#shadow); }
      .text { font: 700 18px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 13px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .label { font: 700 13px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #334155; text-anchor: middle; }
      .line { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1380" height="2180"/>
  <text class="title" x="690" y="48" text-anchor="middle">rg_search_v6b.py Agent 运行流程图</text>
  <text class="subtitle" x="690" y="78" text-anchor="middle">启动初始化 -> 索引目录 -> 多轮工具检索 -> 轮次判断 -> 最终答案 -> 依据抽取</text>

  <!-- 一、启动与资料准备 -->
  <rect class="section" x="80" y="110" width="1220" height="300"/>
  <text class="section-title" x="120" y="138">一、启动与资料准备</text>
  <rect class="node start" x="510" y="160" width="360" height="58"/>
  <text class="text" x="690" y="189">启动 rg_search_v6b.py</text>
  <rect class="node process" x="510" y="245" width="360" height="58"/>
  <text class="text" x="690" y="274">加载 .env 与 MODEL_DICT</text>
  <rect class="node process" x="510" y="330" width="360" height="58"/>
  <text class="text" x="690" y="359">设置 TARGET / INDEX_DIR / FILE_MAP</text>
  <path class="line" d="M690 218 L690 245"/>
  <path class="line" d="M690 303 L690 330"/>

  <!-- 二、run_agent 初始化和索引检查 -->
  <rect class="section" x="80" y="450" width="1220" height="325"/>
  <text class="section-title" x="120" y="478">二、run_agent 初始化和索引检查</text>
  <path class="line" d="M690 388 L690 500"/>
  <rect class="node process" x="510" y="500" width="360" height="58"/>
  <text class="text" x="690" y="529">调用 run_agent(user_question)</text>
  <rect class="node cache" x="510" y="585" width="360" height="58"/>
  <text class="text" x="690" y="614">reset_search_cache()</text>
  <polygon class="decision" points="690,670 850,720 690,770 530,720"/>
  <text class="text" x="690" y="713">index.json</text>
  <text class="small" x="690" y="735">是否存在？</text>
  <rect class="node process" x="170" y="690" width="285" height="58"/>
  <text class="text" x="312.5" y="719">scan_folder 生成索引</text>
  <rect class="node process" x="925" y="690" width="285" height="58"/>
  <text class="text" x="1067.5" y="719">读取全局目录 JSON</text>
  <path class="line" d="M690 558 L690 585"/>
  <path class="line" d="M690 643 L690 670"/>
  <path class="line" d="M530 720 L455 720"/>
  <text class="label" x="492" y="707">否</text>
  <path class="line" d="M850 720 L925 720"/>
  <text class="label" x="888" y="707">是</text>
  <path class="line" d="M455 720 C610 770, 810 770, 925 720"/>

  <!-- 三、最多 15 轮 Agent 工具循环 -->
  <rect class="section" x="80" y="815" width="1220" height="1020"/>
  <text class="section-title" x="120" y="843">三、最多 15 轮 Agent 工具循环</text>
  <path class="line" d="M1067.5 748 L1067.5 790 L690 790 L690 865"/>
  <rect class="node process" x="510" y="865" width="360" height="58"/>
  <text class="text" x="690" y="886">构造 messages</text>
  <text class="small" x="690" y="905">system prompt + user question</text>
  <rect class="node model" x="510" y="950" width="360" height="58"/>
  <text class="text" x="690" y="971">_chat_stream 调用模型</text>
  <text class="small" x="690" y="990">携带 TOOLS_SCHEMA</text>
  <polygon class="decision" points="690,1045 850,1095 690,1145 530,1095"/>
  <text class="text" x="690" y="1088">模型返回</text>
  <text class="small" x="690" y="1110">tool_calls？</text>
  <rect class="node process" x="510" y="1185" width="360" height="58"/>
  <text class="text" x="690" y="1214">解析工具名和 JSON 参数</text>

  <rect class="node tool" x="115" y="1290" width="250" height="64"/>
  <text class="text" x="240" y="1314">get_document_toc</text>
  <text class="small" x="240" y="1335">读取详细目录</text>
  <rect class="node tool" x="415" y="1290" width="250" height="64"/>
  <text class="text" x="540" y="1314">execute_grep</text>
  <text class="small" x="540" y="1335">rg 主搜索</text>
  <rect class="node tool" x="715" y="1290" width="250" height="64"/>
  <text class="text" x="840" y="1314">fetch_supplemental</text>
  <text class="small" x="840" y="1335">批量精读 S 编号</text>
  <rect class="node tool" x="1015" y="1290" width="250" height="64"/>
  <text class="text" x="1140" y="1314">read_file_range</text>
  <text class="small" x="1140" y="1335">读取指定行范围</text>

  <rect class="node cache" x="415" y="1405" width="250" height="58"/>
  <text class="text" x="540" y="1426">去重 + 章节注解</text>
  <text class="small" x="540" y="1445">SEARCH_RESULT_CACHE</text>
  <polygon class="decision" points="540,1495 660,1535 540,1575 420,1535"/>
  <text class="text" x="540" y="1528">限定文件？</text>
  <text class="small" x="540" y="1549">include_files</text>
  <rect class="node tool" x="720" y="1505" width="285" height="58"/>
  <text class="text" x="862.5" y="1526">补充扫描其余文件</text>
  <text class="small" x="862.5" y="1545">生成 S001/S002 短预览</text>
  <rect class="node process" x="510" y="1625" width="360" height="58"/>
  <text class="text" x="690" y="1654">工具结果写回 messages</text>
  <polygon class="decision" points="690,1715 835,1760 690,1805 545,1760"/>
  <text class="text" x="690" y="1753">turn &lt; 15？</text>
  <text class="small" x="690" y="1775">是否还有下一轮</text>

  <path class="line" d="M690 923 L690 950"/>
  <path class="line" d="M690 1008 L690 1045"/>
  <path class="line" d="M690 1145 L690 1185"/>
  <text class="label" x="716" y="1168">是</text>
  <path class="line" d="M690 1243 L690 1270 L240 1270 L240 1290"/>
  <path class="line" d="M690 1243 L690 1270 L540 1270 L540 1290"/>
  <path class="line" d="M690 1243 L690 1270 L840 1270 L840 1290"/>
  <path class="line" d="M690 1243 L690 1270 L1140 1270 L1140 1290"/>
  <path class="line" d="M540 1354 L540 1405"/>
  <path class="line" d="M540 1463 L540 1495"/>
  <path class="line" d="M660 1535 L720 1535"/>
  <text class="label" x="690" y="1524">是</text>
  <path class="line" d="M540 1575 L540 1625"/>
  <text class="label" x="520" y="1602">否</text>
  <path class="line" d="M862.5 1563 L862.5 1600 L690 1600 L690 1625"/>
  <path class="line" d="M240 1354 L240 1654 L510 1654"/>
  <path class="line" d="M840 1354 L840 1385 L1065 1385 L1065 1654 L870 1654"/>
  <path class="line" d="M1140 1354 L1140 1654 L870 1654"/>
  <path class="line" d="M690 1683 L690 1715"/>
  <path class="loop" d="M545 1760 L50 1760 L50 979 L510 979"/>
  <text class="label" x="488" y="1745">是，继续下一轮</text>

  <!-- 四、最终答案和依据抽取 -->
  <rect class="section" x="80" y="1885" width="1220" height="240"/>
  <text class="section-title" x="120" y="1913">四、最终答案和依据抽取</text>
  <rect class="node final" x="230" y="1970" width="300" height="58"/>
  <text class="text" x="380" y="1991">output_final</text>
  <text class="small" x="380" y="2010">再次调用模型整理答案</text>
  <polygon class="decision" points="690,1955 835,1999 690,2043 545,1999"/>
  <text class="text" x="690" y="1992">extract_refs？</text>
  <text class="small" x="690" y="2013">是否抽取依据</text>
  <rect class="node final" x="955" y="1970" width="280" height="58"/>
  <text class="text" x="1095" y="1991">输出最终答案</text>
  <text class="small" x="1095" y="2010">含文件 / 行号 / 条文号</text>
  <rect class="node process" x="585" y="2075" width="300" height="44"/>
  <text class="text" x="735" y="2097">extract_references</text>

  <path class="line" d="M850 1095 L1260 1095 L1260 1860 L380 1860 L380 1970"/>
  <text class="label" x="890" y="1082">否，直接回答</text>
  <path class="line" d="M835 1760 L980 1760 L980 1860 L380 1860 L380 1970"/>
  <text class="label" x="910" y="1745">否，达到 15 轮</text>
  <path class="line" d="M530 1999 L545 1999"/>
  <path class="line" d="M835 1999 L955 1999"/>
  <text class="label" x="895" y="1985">否</text>
  <path class="line" d="M690 2043 L690 2075"/>
  <text class="label" x="712" y="2065">是</text>
  <path class="line" d="M885 2097 L1095 2097 L1095 2028"/>
</svg>
