<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1580" viewBox="0 0 1640 1580" role="img" aria-labelledby="title desc">
  <title id="title">rg-fast-v2c.py：BM25 文件内二次召回流程图</title>
  <desc id="desc">展示 v2c 精简流程：系统先做全局 BM25 Top-N 预览召回；第一次 LLM 只选择高概率文件并调用文件内 BM25；系统整理证据后，第二次 LLM 生成终稿。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #475569; }
      .section { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .section-title { font: 700 18px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #334155; }
      .node { stroke-width: 1.8; rx: 14; filter: url(#shadow); }
      .user { fill: #e0f2fe; stroke: #0284c7; }
      .system { fill: #ecfeff; stroke: #0891b2; }
      .llm1 { fill: #fef3c7; stroke: #d97706; }
      .tool { fill: #dcfce7; stroke: #16a34a; }
      .merge { fill: #ede9fe; stroke: #7c3aed; }
      .llm2 { fill: #fee2e2; stroke: #dc2626; }
      .text { font: 700 20px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 14px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .note-title { font: 700 15px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #334155; }
      .note-text { font: 500 13px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1640" height="1580"/>
  <text class="title" x="820" y="50" text-anchor="middle">rg-fast-v2c.py：BM25 文件内二次召回模式</text>
  <text class="subtitle" x="820" y="80" text-anchor="middle">全局 Top-N 前 50 字预览 -> 第 1 次 LLM 选文件 -> 文件内 BM25 -> 第 2 次 LLM 生成终稿</text>

  <rect class="section" x="80" y="115" width="1050" height="1350"/>
  <text class="section-title" x="120" y="145">主流程</text>

  <rect class="node user" x="425" y="170" width="360" height="70"/>
  <text class="text" x="605" y="198">用户提问</text>
  <text class="small" x="605" y="220">自然语言问题</text>

  <rect class="node system" x="245" y="300" width="720" height="175"/>
  <text class="text" x="605" y="330">第 1 步：系统层全局 BM25 召回</text>
  <text class="small" x="605" y="364">非 LLM：根据用户问题检索预建切片索引</text>
  <text class="small" x="605" y="394">取 Top-N 条目</text>
  <text class="small" x="605" y="424">返回：条目编号 + 文件路径 + 起止行号 + 前 50 字预览</text>

  <rect class="node llm1" x="245" y="555" width="720" height="165"/>
  <text class="text" x="605" y="585">第 2 步：第 1 次 LLM 选择高概率文件</text>
  <text class="small" x="605" y="620">输入：用户问题 + Top-N 条目预览</text>
  <text class="small" x="605" y="650">只调用工具：search_high_probability_files</text>
  <text class="small" x="605" y="680">工具由系统自动使用原始用户问题，不让 LLM 改写 query</text>

  <rect class="section" x="205" y="785" width="800" height="285"/>
  <text class="section-title" x="245" y="815">本地工具执行</text>

  <rect class="node tool" x="305" y="860" width="600" height="130"/>
  <text class="text" x="605" y="890">工具 1：高概率文件 BM25</text>
  <text class="small" x="605" y="925">输入：LLM 选出的文件列表</text>
  <text class="small" x="605" y="955">逻辑：文件内 BM25 返回完整证据，直接进入终稿</text>

  <rect class="node llm2" x="245" y="1130" width="720" height="145"/>
  <text class="text" x="605" y="1160">第 3 步：第 2 次 LLM 生成终稿</text>
  <text class="small" x="605" y="1195">输入：文件内 BM25 返回的完整证据片段</text>
  <text class="small" x="605" y="1225">输出：最终答案 + 明确依据</text>

  <rect class="node llm2" x="425" y="1325" width="360" height="70"/>
  <text class="text" x="605" y="1360">最终答案</text>

  <path class="line" d="M605 240 L605 300"/>
  <path class="line" d="M605 475 L605 555"/>
  <path class="line" d="M605 720 L605 785"/>
  <path class="line" d="M605 990 L605 1130"/>

  <path class="line" d="M605 1275 L605 1325"/>

  <rect class="note" x="1005" y="330" width="300" height="118"/>
  <text class="note-title" x="1035" y="360">Top-N 条目格式</text>
  <text class="note-text" x="1035" y="390">- item_id</text>
  <text class="note-text" x="1035" y="415">- 文件路径 / 起止行号</text>
  <text class="note-text" x="1035" y="440">- 原文前 50 字预览</text>
  <path class="thin" d="M965 388 L1005 388"/>

  <rect class="note" x="1005" y="575" width="300" height="130"/>
  <text class="note-title" x="1035" y="605">第 1 次 LLM 只选文件</text>
  <text class="note-text" x="1035" y="635">不读取 P001 等条目全文</text>
  <text class="note-text" x="1035" y="660">不生成最终答案</text>
  <text class="note-text" x="1035" y="685">只圈定高概率文件范围</text>
  <path class="thin" d="M965 640 L1005 640"/>

  <rect class="note" x="1005" y="880" width="300" height="120"/>
  <text class="note-title" x="1035" y="910">精简点</text>
  <text class="note-text" x="1035" y="940">移除 v2b 的 read_preview_items</text>
  <text class="note-text" x="1035" y="965">相信 Top-N 已足够暴露相关文件</text>
  <text class="note-text" x="1035" y="990">减少一次工具分支和证据噪声</text>
  <path class="thin" d="M905 925 L1005 925"/>

  <rect class="note" x="1005" y="1150" width="300" height="118"/>
  <text class="note-title" x="1035" y="1180">第 2 次 LLM 只看全文</text>
  <text class="note-text" x="1035" y="1210">完整证据来自文件内 BM25</text>
  <text class="note-text" x="1035" y="1235">直接综合证据输出终稿</text>
  <path class="thin" d="M965 1202 L1005 1202"/>

  <rect class="section" x="1340" y="115" width="250" height="1350"/>
  <text class="section-title" x="1375" y="145">核心特征</text>

  <rect class="note" x="1365" y="190" width="200" height="100"/>
  <text class="note-title" x="1390" y="220">第一步</text>
  <text class="note-text" x="1390" y="250">系统 BM25 全局召回</text>
  <text class="note-text" x="1390" y="275">返回 Top-N 预览</text>

  <rect class="note" x="1365" y="335" width="200" height="115"/>
  <text class="note-title" x="1390" y="365">第二步</text>
  <text class="note-text" x="1390" y="395">第 1 次 LLM</text>
  <text class="note-text" x="1390" y="420">只选高概率文件</text>
  <text class="note-text" x="1390" y="445">只调一个工具</text>

  <rect class="note" x="1365" y="495" width="200" height="100"/>
  <text class="note-title" x="1390" y="525">工具</text>
  <text class="note-text" x="1390" y="555">文件内 BM25</text>
  <text class="note-text" x="1390" y="580">原始问题由系统注入</text>

  <rect class="note" x="1365" y="640" width="200" height="100"/>
  <text class="note-title" x="1390" y="670">第三步</text>
  <text class="note-text" x="1390" y="700">第 2 次 LLM</text>
  <text class="note-text" x="1390" y="725">基于全文出终稿</text>

  <rect class="note" x="1365" y="785" width="200" height="120"/>
  <text class="note-title" x="1390" y="815">相对 v2b</text>
  <text class="note-text" x="1390" y="845">无按编号精读工具</text>
  <text class="note-text" x="1390" y="870">更短上下文</text>
  <text class="note-text" x="1390" y="895">速度更稳</text>
</svg>

