[project]
name = "llm-rg-search"
version = "0.1.0"
description = "LLM RG Search - agentic / fast / hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=2.21.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.0",
    "anyio>=4.0",
    "pymupdf>=1.23",
    "pdfplumber>=0.10",
]

[tool.uv]
managed = true

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["extract_toc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
